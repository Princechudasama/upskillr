spring.application.name=backend

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/upskillr
spring.datasource.username=postgres
spring.datasource.password=Prince.a123
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
# Schema is now owned by Flyway migrations, not Hibernate auto-DDL.
# 'validate' makes Hibernate check entities match the DB schema and fail fast on drift.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:ChangeThisToALongRandomBase64EncodedSecretKeyForJWTSigning123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Server ----------
server.port=8080